<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment five</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div>
        <header>
            <h1>Assignment 5</h1>
            <h2>Introduction to Javascript</h2>
        </header>
        <main>
            <section class="columns" id="box-container">
                <div class="boxes" id="speech-box">
                    <h3>Speech</h3>
                    <div id="speech-bubble">
                        <div id="speech-text-container">
                            <p>hi</p>
                        </div>
                        <div id="speech-tail">
                            <p>ㅤ</p>
                        </div>
                    </div>
                </div>
                <div class="boxes">
                    <h3>Beverage</h3>
                    <label for="drinks">Choose your drink:</label>
                    <select name="drinks" id="drink-select">
                        <option>Sprite</option>
                        <option>Coca Cola</option>
                        <option>Pepsi</option>
                        <option>Ginger Ale</option>
                    </select>
                    <p id="selected-drink-box"></p>
                </div>
                <div class="boxes" id="sticker-box">
                    <h3>Add a Sticker</h3>
                    <img src="images/sun-resized.png" alt="sun" />
                    <img id="sunglasses" src="images/sunglasses-resized.png" alt="sunglasses" />
                </div>
            </section>
        </main>
        <footer>
            <p>&copy;ejgordon</p>
        </footer>
    </div>
    <script src="scripts/index.js"></script>
</body>

</html>
