<!DOCTYPE html>

<html>
    <head>
        <!--

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css"/>
        <title>EJ's ANIDB</title>
    </head>
    <body id="content">
        <div>
            <header id="main-header">
                <nav class="columns" id="main-nav">
                    <a href="#" id="logo-text">
                        <div id="logo-icon">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <rect x="1" y="1" width="4" height="4" fill="white"/>
                                <rect x="7" y="1" width="4" height="4" fill="white"/>
                                <rect x="4" y="7" width="4" height="4" fill="white"/>
                            </svg>
                        </div>
                        <h2>EJ's ANIDB</h2>
                    </a>
                    <ul class="columns" id="nav-links">
                        <li><a href="#" class="nav-link active">Home</a></li>
                        <li><a href="#" class="nav-link">Anime</a></li>
                        <li><a href="#" class="nav-link">Manga</a></li>
                        <li><a href="#" class="nav-link">Light Novels</a></li>
                    </ul>
                </nav>
            </header>
            <section id="hero-section">
                <img src="https://images.unsplash.com/photo-1617293134227-0ec282f3ed89?w=1400&h=600&fit=crop&auto=format" alt="Night cityscape"/>
                <div id="hero-overlay"></div>
                <div id="hero-content">
                    <p id="hero-label">Personal Collection</p>
                    <h1 id="hero-title">EJ's Anime<br>Database</h1>
                    <p id="hero-sub">A curated personal log of anime, manga, and light novels — rated and ranked.</p>
                </div>
            </section>
            <div id="stats-bar">
                <span id="stats-label">In database</span>
                <div id="stats-counts">
                    <span class="stat-item"><span id="ani-value"></span> Anime</span>
                    <span class="stat-divider"></span>
                    <span class="stat-item"><span id="manga-value"></span> Manga</span>
                    <span class="stat-divider"></span>
                    <span class="stat-item"><span id="ln-value"></span> Light Novels</span>
                </div>
                <span id="stats-total">369 total</span>
            </div>
            <main>
                <section>

                </section>
            </main>
            <footer>
                <p>&copy; ejgordon</p>
            </footer>
        </div>
        <script src="scripts/index.js"></script>
    </body>
</html>
